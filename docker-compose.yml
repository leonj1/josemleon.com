services:
  victoriametrics:
    image: victoriametrics/victoria-metrics
    command: ["-retentionPeriod=12"]
    ports:
      # LAN-accessible so vmui can be viewed from other machines; the query API
      # has no auth, so do not port-forward 8428 beyond the local network.
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data

  metrics-ingest:
    build:
      context: ./metrics-ingest
    depends_on:
      - victoriametrics
    environment:
      VM_IMPORT_URL: http://victoriametrics:8428/api/v1/import/prometheus
      PORT: "9091"
    ports:
      - "127.0.0.1:9091:9091"

  site:
    build:
      context: .
    depends_on:
      - metrics-ingest
    environment:
      INGEST_PORT: "9091"
    ports:
      - "8099:80"

volumes:
  vm-data:
